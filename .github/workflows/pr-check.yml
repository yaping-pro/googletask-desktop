name: PR Configuration Check

on:
  pull_request:
    paths:
      - "app.json"
      - ".github/workflows/**"
      - "tests/**"
  push:
    branches:
      - main
    paths:
      - "app.json"
      - ".github/workflows/**"
      - "tests/**"

jobs:
  validate-config:
    name: 校验打包契约
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行端到端契约测试
        run: python3 -m unittest discover -s tests -v

      - name: 校验 JSON 语法
        run: |
          python3 -c "
          import json
          with open('app.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          assert 'url' in data, 'Missing url field'
          assert 'name' in data, 'Missing name field'
          print('app.json 语法及必要字段校验通过:', data['name'], data['url'])
          "
